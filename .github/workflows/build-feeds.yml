name: Build feeds

# Refreshes the static category feeds once a day so the app can swipe real
# tracks without spending each user's live YouTube search quota. Requires a
# repository secret named YT_API_KEY (a YouTube Data API v3 key).

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build feeds
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/build-feeds.mjs

      - name: Commit refreshed feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feeds
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "chore: refresh static feeds"
            git push
          fi
